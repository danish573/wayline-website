# Corrected deployment.yaml
apiVersion: apps/v1
kind: Deployment # Corrected from 'deployment' for consistency
metadata:
  name: wayline-website
  namespace: wayline-website # Corrected from 'NameSpace'
spec: # Corrected from 'specs'
  replicas: 2
  selector:
    matchLabels: # Corrected from 'matchlabels'
      app: wayline
  template: # Correctly indented
    metadata:
      labels:
        app: wayline
    spec: # Corrected from 'specs'
      containers:
      - name: wayline
        image: dkhan573/wayline-website:latest
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10